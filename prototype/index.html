<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="浏览胶片、查看包装与暗盒的 3D 模型，以及胶片的基本资料。">
  <title>dxxnomore · 胶片资料馆</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23101010'/%3E%3Crect x='12' y='12' width='40' height='40' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" id="home-link" aria-label="dxxnomore，返回胶片目录">d<span class="brand-x">xx</span>nomore</a>
  </header>
  <main>
    <section id="collection" class="collection" aria-labelledby="collection-title">
      <div class="collection-heading"><h1 id="collection-title">胶片目录</h1></div>
      <div class="catalog-tools">
        <label class="search-field"><span class="visually-hidden">搜索胶片</span><input id="film-search" type="search" placeholder="搜索胶片或品牌" autocomplete="off"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></label>
        <button type="button" id="filters-toggle" class="filters-toggle" aria-controls="filter-panel" aria-expanded="false">筛选 <span id="filter-count" hidden></span><span class="chevron" aria-hidden="true"></span></button>
        <label class="sort-field"><span>排序</span><select id="sort-order" aria-label="胶片排序"><option value="default">默认顺序</option><option value="name">名称</option><option value="brand">品牌</option><option value="iso-asc">ISO 从低到高</option><option value="iso-desc">ISO 从高到低</option></select></label>
      </div>
      <div id="filter-panel" class="filter-panel" hidden>
        <div class="filter-head"><h2>筛选</h2><button type="button" id="clear-filters">清除筛选</button></div>
        <div id="filter-groups" class="filter-groups"></div>
      </div>
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <div id="film-grid" class="film-grid" aria-live="polite"></div>
      <div id="empty-results" class="empty-results" hidden><p>没有找到符合条件的胶片。</p><button type="button" id="reset-results">清除筛选</button></div>
      <p id="load-error" class="load-error" hidden>胶片目录暂时无法读取，请稍后重新打开。</p>
    </section>
    <section id="detail" class="detail" aria-labelledby="record-title" hidden>
      <div class="detail-top"><button type="button" id="back-button" class="back-button">← 返回目录</button></div>
      <div class="detail-layout">
        <div class="viewer">
          <div class="viewer-stage"><canvas id="model-canvas" aria-label="可拖动旋转的胶片三维示意模型"></canvas><div id="viewer-fallback" class="viewer-fallback" hidden>3D 模型暂时无法载入。</div></div>
          <div class="stage-controls" role="group" aria-label="查看胶片结构"><button type="button" data-stage="0" aria-pressed="true">纸盒</button><button type="button" data-stage="1" aria-pressed="false">暗盒</button><button type="button" data-stage="2" aria-pressed="false">胶片</button><button type="button" id="reset-view" aria-label="重置三维视角">重置视角</button></div>
        </div>
        <div class="record">
          <p id="record-brand" class="record-brand"></p><h2 id="record-title"></h2><p id="record-type" class="record-type"></p>
          <dl class="specs"><div><dt>ISO</dt><dd id="spec-iso"></dd></div><div><dt>画幅</dt><dd id="spec-format"></dd></div><div><dt>冲洗</dt><dd id="spec-process"></dd></div></dl>
          <a id="record-source" class="source-link" href="#" target="_blank" rel="noopener noreferrer">资料来源 ↗</a>
          <p class="model-note">3D 包装为示意模型</p>
        </div>
      </div>
      <div id="more-content" class="more-content" hidden></div>
    </section>
  </main>
</body>
</html>
